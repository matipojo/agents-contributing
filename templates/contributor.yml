# Contributor config for agents-contributing.
# Optional: without it the runner uses these same defaults, and takes the provider from the agent
# that calls it. Lives at ~/.agents-contributing/contributor.yml, and in the runner repository
# when there is one (there the provider line is required: no agent is calling).

version: 1

# Which provider adapter to use for the balance check.
# Known adapters: claude-code, codex, cursor, declared
provider: claude-code

# Which repositories you are willing to contribute to.
# Use exact repos and/or topics. A repo must ALSO have AGENTS-CONTRIBUTING.md.
targets:
  repos: []            # e.g. [owner/repo]
  topics: [agents-contributing]

# Which help types you are willing to do, in the order you prefer them.
# The runner does audit, pr and review today. The spec's other types (reproduce, triage,
# tests, docs, translate, answer) may be listed too; the runner skips them until it supports them.
help_types: [audit, pr, review]

# Surplus rules.
budget:
  window: ""                  # which usage window counts as "surplus"; empty: the provider's own
  lead_hours: 24              # only contribute within this many hours before the window resets
  margin_pct: 10              # always keep this much of the window unused
  donate_fraction: 1.0        # share of the surplus to give (0.0 to 1.0)
  min_surplus_pct: 5          # skip if the surplus is smaller than this

# What may be donated: the subscription usage windows, credits, or both.
# Some agents charge cloud runs to credits first (see the provider's README).
donate: [subscription, credits]

# Credits that expire, such as Claude cloud session credits. How much is left is usually
# not exposed, so only the last days are donated.
credits:
  lead_days: 3                # start donating this many days before the credits expire
  daily_usd: 15               # spend at most this much per daily run
  remind_days: 7              # remind you once, this many days before they expire

# Used only by the "declared" adapter, for providers that do not expose usage.
declared:
  timezone: UTC
  weekly_reset: "sun 00:00"   # day and time the weekly window resets

# Contributor log (contributions.jsonl). Turning it off removes attribution.
log: true
