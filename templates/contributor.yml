# Contributor config for agents-contributing.
# Lives in the contributor's runner repository (or locally at ~/.agents-contributing/contributor.yml).

version: 1

# Which provider adapter to use for the balance check.
# Known adapters: claude-code, declared
provider: claude-code

# Which repositories you are willing to contribute to.
# Use exact repos and/or topics. A repo must ALSO have AGENTS-CONTRIBUTING.md.
targets:
  repos: []            # e.g. [owner/repo]
  topics: [agents-contributing]

# Which help types you are willing to do.
help_types: [reproduce, triage, tests, docs]

# Surplus rules.
budget:
  window: seven_day           # which usage window counts as "surplus"
  lead_hours: 24              # only contribute within this many hours before the window resets
  margin_pct: 10              # always keep this much of the window unused
  donate_fraction: 1.0        # share of the surplus to give (0.0 to 1.0)
  min_surplus_pct: 5          # skip if the surplus is smaller than this

# Used only by the "declared" adapter, for providers that do not expose usage.
declared:
  timezone: UTC
  weekly_reset: "sun 00:00"   # day and time the weekly window resets

# Contributor log (contributions.jsonl). Turning it off removes attribution.
log: true
