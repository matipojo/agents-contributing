# The agents-contributing runner. Runs once a day; contributes only when the balance check
# says there is surplus to give, and at most one contribution per runner call.
name: contribute

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Do everything except writing to GitHub"
        type: boolean
        default: false
      force:
        description: "Contribute even when the balance check says not to"
        type: boolean
        default: false

permissions:
  contents: read

# One run at a time, so two runs never race for the same task.
concurrency:
  group: contribute
  cancel-in-progress: false

jobs:
  contribute:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # The commit of the agents-contributing tools this runner runs: the one you set it up
      # from. The tools run with this repository's secrets, so they are never taken from a
      # branch, which can change under you. To update, update your local tools and run
      # setup-runner.sh again; it writes the new commit here.
      TOOLS_REF: "__TOOLS_REF__"
      AGENTS_CONTRIBUTING_HOME: ${{ github.workspace }}
      AGENTS_CONTRIBUTING_GITHUB_TOKEN: ${{ secrets.AGENTS_CONTRIBUTING_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Get the tools
        run: |
          # Only a full commit id: a branch or tag name could be moved to other code.
          echo "$TOOLS_REF" | grep -Eq '^[0-9a-f]{40}$' || { echo "TOOLS_REF must be a full commit id. Run setup-runner.sh again."; exit 1; }
          git init --quiet "$RUNNER_TEMP/tools"
          git -C "$RUNNER_TEMP/tools" fetch --quiet --depth 1 https://github.com/matipojo/agents-contributing "$TOOLS_REF"
          git -C "$RUNNER_TEMP/tools" checkout --quiet --detach FETCH_HEAD
          [ "$(git -C "$RUNNER_TEMP/tools" rev-parse HEAD)" = "$TOOLS_REF" ]
          npm --prefix "$RUNNER_TEMP/tools" ci --silent

      - name: Install the agent
        # The provider's adapter says how; it fails here if the provider cannot run in Actions.
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          "$RUNNER_TEMP/tools/node_modules/.bin/tsx" "$RUNNER_TEMP/tools/src/cli/provider.ts" ci-install contributor.yml
          # Export only the secret the adapter declares (ci.secret.name), for the next steps.
          "$RUNNER_TEMP/tools/node_modules/.bin/tsx" "$RUNNER_TEMP/tools/src/cli/provider.ts" ci-env contributor.yml

      - name: Keep the runner repository closed
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.AGENTS_CONTRIBUTING_GITHUB_TOKEN }}
        run: gh api -X PUT "repos/${{ github.repository }}/interaction-limits" -f limit=collaborators_only -f expiry=six_months > /dev/null

      - name: Contribute
        run: |
          flags=""
          [ "${{ inputs.dry_run }}" = "true" ] && flags="$flags --dry-run"
          [ "${{ inputs.force }}" = "true" ] && flags="$flags --force"
          # Each call makes at most one contribution: 0 contributed, 10 nothing to do, 2 error.
          for i in $(seq 1 10); do
            set +e
            "$RUNNER_TEMP/tools/node_modules/.bin/tsx" "$RUNNER_TEMP/tools/src/cli/run.ts" $flags
            code=$?
            set -e
            [ "$code" = "0" ] && [ -z "$flags" ] && continue
            [ "$code" = "2" ] && exit 1
            break
          done
